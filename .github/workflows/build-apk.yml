name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm install

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Prepare APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/statix-pro-v1.0.apk
          echo "APK successfully built at release-apk/statix-pro-v1.0.apk"

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: statix-pro-android-apk
          path: release-apk/statix-pro-v1.0.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: STATIX PRO v1.0.0 (Android APK)
          body: |
            ## 📱 فایل نصبی مستقیم اپلیکیشن اندروید (Standalone APK)

            فایل نصبی مستقیم برای تمامی گوشی‌ها و تبلت‌های اندروید.

            * **فایل نصبی:** `statix-pro-v1.0.apk`
            * **قابلیت‌ها:** ۱۰۰٪ مستقل و آفلاین، بدون نیاز به سرور یا اینترنت
            * **سرفصل‌ها:** تحلیل تیر، دیاگرام برش و لنگر (SFD/BMD)، خرپا، بردارها، لنگر، مرکز سطح، اینرسی، اصطکاک و کابل‌ها.
          files: release-apk/statix-pro-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
